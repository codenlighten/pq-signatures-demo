[package]
name = "hybridsig"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Demonstration hybrid signature (Ed25519 and ML-DSA-65, both must verify) built on third-party libraries. Not audited."
publish = false

[dependencies]
curve25519-dalek = "5.0.0"
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
fips204 = { version = "0.5.0", default-features = false, features = ["ml-dsa-65"] }
getrandom = "0.4"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
ml-dsa = "0.1.2"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

[profile.dev.package."*"]
# The lattice arithmetic is very slow unoptimised; this keeps the tests quick.
opt-level = 3
